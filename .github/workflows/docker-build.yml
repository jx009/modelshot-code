name: Publish Docker image (Multi-arch)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ${{ vars.DOCKERHUB_IMAGE }}

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      build_tag: ${{ steps.release.outputs.build_tag }}
    steps:
      - name: Resolve image repository
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo '::error::Configure DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets.'
            exit 1
          fi
          if [[ -z "$IMAGE" ]]; then
            echo '::error::Configure DOCKERHUB_IMAGE as a repository variable, for example your-docker-id/modelshot.'
            exit 1
          fi
          if [[ ! "$IMAGE" =~ ^[a-z0-9][a-z0-9_-]*/[a-z0-9]+([._-][a-z0-9]+)*$ ]]; then
            echo '::error::DOCKERHUB_IMAGE must be a lowercase Docker Hub namespace/repository.'
            exit 1
          fi
          auth_response=$(curl --fail --silent --show-error \
            --user "$DOCKERHUB_USERNAME:$DOCKERHUB_TOKEN" \
            --get 'https://auth.docker.io/token' \
            --data-urlencode 'service=registry.docker.io' \
            --data-urlencode "scope=repository:$IMAGE:pull,push")
          AUTH_RESPONSE="$auth_response" TARGET_IMAGE="$IMAGE" python3 <<'PY'
          import base64
          import json
          import os
          import sys

          response = json.loads(os.environ["AUTH_RESPONSE"])
          token = response.get("token") or response.get("access_token")
          if not token:
              print("::error::Docker Hub did not issue a registry token for the configured credentials.")
              sys.exit(1)
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          image = os.environ["TARGET_IMAGE"]
          actions = {
              action
              for entry in claims.get("access", [])
              if entry.get("type") == "repository" and entry.get("name") == image
              for action in entry.get("actions", [])
          }
          if "push" not in actions:
              print(
                  f"::error::Docker Hub credentials cannot push to {image}. "
                  "Create that repository under the authenticated account/organization, "
                  "or correct DOCKERHUB_IMAGE and the token permissions."
              )
              sys.exit(1)
          print(f"Docker Hub push authorization verified for {image}.")
          PY
      # Failed-job reruns reuse this successful job's output. Do not recompute
      # run_attempt in consumers: successful build jobs may not run again.
      - name: Freeze release tag for downstream jobs
        id: release
        env:
          RELEASE_TAG: build-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: printf 'build_tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  build_single_arch:
    name: Build and push (${{ matrix.arch }})
    needs: prepare
    env:
      BUILD_TAG: ${{ needs.prepare.outputs.build_tag }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
      - name: Image labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
      - name: Log in to Docker Hub
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Install registry transfer tool
        run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Download pinned Node base with registry fallback
        id: node-base
        timeout-minutes: 22
        env:
          ARCH: ${{ matrix.arch }}
          BASE_DIRECTORY: ${{ runner.temp }}/node-base
        run: bash scripts/prepare-node-base.sh "$ARCH" "$BASE_DIRECTORY"
      - name: Build architecture image locally
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=oci,dest=${{ runner.temp }}/modelshot-image.tar
          tags: ${{ env.IMAGE }}:${{ env.BUILD_TAG }}-${{ matrix.arch }}
          # BuildKit reads the verified local OCI content, not a remote registry.
          build-contexts: |
            node-base=${{ steps.node-base.outputs.context }}
          build-args: |
            NODE_IMAGE=node-base
            NEXT_DEPLOYMENT_ID=${{ env.BUILD_TAG }}
            NEXT_STATIC_ASSET_NAMESPACE=${{ env.BUILD_TAG }}-${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=modelshot-${{ matrix.arch }}
          cache-to: type=gha,scope=modelshot-${{ matrix.arch }},mode=max,ignore-error=true
          provenance: mode=max
          sbom: true
      - name: Push exact build output with backoff
        env:
          ARCHIVE: ${{ runner.temp }}/modelshot-image.tar
          TARGET: ${{ env.IMAGE }}:${{ env.BUILD_TAG }}-${{ matrix.arch }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: bash scripts/push-image-archive.sh "$ARCHIVE" "$TARGET" "$DIGEST"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign architecture digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: bash scripts/retry-registry.sh cosign sign --yes "$IMAGE@$DIGEST"

  build_tools_single_arch:
    name: Build image tools (${{ matrix.arch }})
    # Avoid competing with the application's two architecture publications.
    needs: [prepare, build_single_arch]
    env:
      BUILD_TAG: ${{ needs.prepare.outputs.build_tag }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 80
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
      - name: Log in to Docker Hub
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build tools architecture image locally
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile.tools
          platforms: ${{ matrix.platform }}
          outputs: type=oci,dest=${{ runner.temp }}/modelshot-tools-image.tar
          tags: ${{ env.IMAGE }}:tools-${{ env.BUILD_TAG }}-${{ matrix.arch }}
          cache-from: type=gha,scope=modelshot-tools-${{ matrix.arch }}
          cache-to: type=gha,scope=modelshot-tools-${{ matrix.arch }},mode=max,ignore-error=true
          provenance: mode=max
          sbom: true
      - name: Install registry transfer tool
        run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Push exact tools build output with backoff
        env:
          ARCHIVE: ${{ runner.temp }}/modelshot-tools-image.tar
          TARGET: ${{ env.IMAGE }}:tools-${{ env.BUILD_TAG }}-${{ matrix.arch }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: bash scripts/push-image-archive.sh "$ARCHIVE" "$TARGET" "$DIGEST"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign tools architecture digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: bash scripts/retry-registry.sh cosign sign --yes "$IMAGE@$DIGEST"

  publish_hk_static:
    name: Publish immutable static assets to Hong Kong
    needs: [prepare, build_single_arch]
    env:
      BUILD_TAG: ${{ needs.prepare.outputs.build_tag }}
    if: github.ref == 'refs/heads/main' && vars.HK_STATIC_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
      - uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract assets from the exact images being published
        run: bash scripts/extract-static.sh hk-static
      - name: Upload without replacing or removing live assets
        env:
          HK_SERVER_HOST: ${{ secrets.HK_SERVER_HOST }}
          HK_SERVER_USER: ${{ secrets.HK_SERVER_USER }}
          HK_SERVER_SSH_KEY: ${{ secrets.HK_SERVER_SSH_KEY }}
          HK_SERVER_KNOWN_HOSTS: ${{ secrets.HK_SERVER_KNOWN_HOSTS }}
          HK_SERVER_PORT: ${{ vars.HK_SERVER_PORT || '22' }}
          HK_STATIC_BWLIMIT_KIB: ${{ vars.HK_STATIC_BWLIMIT_KIB || '0' }}
        run: bash scripts/deploy-hk-static.sh hk-static
      - name: Deployment summary
        run: echo 'Hong Kong static assets published additively. Old files retained; public tags wait for all enabled edge uploads and builds.' >> "$GITHUB_STEP_SUMMARY"

  create_manifests:
    name: Publish multi-arch tags
    needs: [prepare, build_single_arch, build_tools_single_arch, publish_hk_static]
    env:
      BUILD_TAG: ${{ needs.prepare.outputs.build_tag }}
    # A disabled edge deployment or a non-main release may skip its upload.
    # Once enabled, an upload failure must prevent latest/main/SHA tags advancing.
    if: >-
      ${{ !cancelled() && needs.prepare.result == 'success' &&
          needs.build_single_arch.result == 'success' &&
          needs.build_tools_single_arch.result == 'success' &&
          (needs.publish_hk_static.result == 'success' || needs.publish_hk_static.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
      - uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Resolve public tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=long
      - name: Resolve tools tags
        id: tools-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=tools-latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=tools-${{ github.ref_name }}
            type=sha,format=long,prefix=tools-sha-
      - name: Merge, sign and summarize
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        shell: bash
        run: bash scripts/publish-image-manifest.sh "$IMAGE:$BUILD_TAG-amd64" "$IMAGE:$BUILD_TAG-arm64"
      - name: Merge, sign and summarize tools image
        env:
          TAGS: ${{ steps.tools-meta.outputs.tags }}
        shell: bash
        run: bash scripts/publish-image-manifest.sh "$IMAGE:tools-$BUILD_TAG-amd64" "$IMAGE:tools-$BUILD_TAG-arm64"

  mirror_registry:
    name: Mirror tags to a regional registry
    needs: [prepare, create_manifests]
    if: >-
      ${{ !cancelled() && needs.prepare.result == 'success' && needs.create_manifests.result == 'success' &&
          vars.MIRROR_IMAGE != '' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Sign in to both registries
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          MIRROR_IMAGE: ${{ vars.MIRROR_IMAGE }}
          MIRROR_REGISTRY_USERNAME: ${{ secrets.MIRROR_REGISTRY_USERNAME }}
          MIRROR_REGISTRY_PASSWORD: ${{ secrets.MIRROR_REGISTRY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          host=${MIRROR_IMAGE%%/*}
          echo "$MIRROR_REGISTRY_PASSWORD" | docker login -u "$MIRROR_REGISTRY_USERNAME" --password-stdin "$host"
      - name: Copy the merged indexes
        # A mirror failure must not fail the release: Docker Hub remains the source of truth.
        continue-on-error: true
        env:
          MIRROR_IMAGE: ${{ vars.MIRROR_IMAGE }}
          SHA: ${{ github.sha }}
        shell: bash
        run: bash scripts/mirror-image.sh
      - name: Deployment summary
        if: ${{ always() }}
        env:
          MIRROR_IMAGE: ${{ vars.MIRROR_IMAGE }}
        run: >-
          echo "Regional mirror: ${MIRROR_IMAGE:-not configured} (see the copy step above for per-tag results)."
          >> "$GITHUB_STEP_SUMMARY"
