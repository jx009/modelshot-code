name: Browser font diagnostics
on:
  push:
    paths:
      - .github/workflows/font-diagnostics.yml
      - scripts/browser-font-diagnostics.mjs
permissions:
  contents: read
jobs:
  fonts:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - run: npm ci
      - name: Install browser and CJK fonts
        run: |
          printf '%s\n' 'https://mirrors.edge.kernel.org/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          npx playwright install --with-deps chromium
          fc-cache -f
      - run: node scripts/browser-font-diagnostics.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: browser-font-diagnostics
          path: font-diagnostics/
          retention-days: 7
