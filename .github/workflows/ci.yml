name: V1 Development Acceptance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  local-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://modelshot:local-modelshot-only@127.0.0.1:55432/modelshot_test
      DIRECT_URL: postgresql://modelshot:local-modelshot-only@127.0.0.1:55432/modelshot_test
      NEXTAUTH_URL: http://127.0.0.1:3100
      NEXTAUTH_SECRET: isolated-ci-session-secret-not-for-deployment
      C2PA_ENABLED: "0"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@10.9.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: npm ci
      - run: npx prisma generate
      - run: npm run infra:up
      - run: npx playwright install --with-deps chromium
      - run: npm run test:acceptance
      - run: npm run test:recovery
      - run: npm run test:capacity
      - name: Dependency audit report
        if: always()
        run: npm run check:dependencies
      - name: Upload failure reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ failure() }}
        continue-on-error: true
        with:
          name: acceptance-reports
          retention-days: 1
          if-no-files-found: warn
          path: |
            playwright-report/
            test-results/
      - if: always()
        run: docker compose down
