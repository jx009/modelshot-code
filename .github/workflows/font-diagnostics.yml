name: Browser font diagnostics
on:
  push:
    paths: [.github/workflows/font-diagnostics.yml]
permissions:
  contents: read
jobs:
  fonts:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install browser and fonts
        run: |
          printf '%s\n' 'https://mirrors.edge.kernel.org/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          npx playwright install --with-deps chromium
          fc-cache -f
      - name: Trace disabled comparison
        continue-on-error: true
        env:
          JIMENG_FONT_PROBE: "1"
        run: npm run test:ui -- tests/ui/jimeng-image-video.spec.mjs --grep 'browser provides' --workers=1 --trace=off --output=font-off
      - name: Trace enabled comparison
        continue-on-error: true
        env:
          JIMENG_FONT_PROBE: "1"
        run: npm run test:ui -- tests/ui/jimeng-image-video.spec.mjs --grep 'browser provides' --workers=1 --trace=on --output=font-on
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: font-runner-comparison
          path: |
            font-off/
            font-on/
          retention-days: 7
