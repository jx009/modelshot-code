# 香港入口 · 公开页面 HTML 微缓存 + 压缩
#
# 背景：首页等公开页由 Next.js 预渲染（x-nextjs-prerender: 1），内容与登录态无关，
# 会话在浏览器端获取。但香港原先对 HTML 全部回源美国，中国网络首字节实测约 7.9 秒。
# 本配置让香港缓存这些页面的完整 HTML，回源只在后台进行。
#
# 安全边界：
# - 只缓存完整文档请求；RSC / 预取请求（带 RSC、Next-Router-* 头）一律回源，不进缓存。
# - 带 Set-Cookie 的响应 Nginx 默认不缓存（不要添加 proxy_ignore_headers Set-Cookie）。
# - 只匹配下列公开路径；/api、/studio-v2、/account、/admin 等仍走原 location /。

# ── 第一部分：放在 http {} 内，与 letaidraw_us_origin upstream 同级 ──
proxy_cache_path /www/server/nginx/proxy_cache/letaidraw_pages levels=1:2 keys_zone=letaidraw_hk_pages:20m max_size=512m inactive=1d use_temp_path=off;

map "$http_rsc$http_next_router_prefetch$http_next_router_state_tree" $letaidraw_page_bypass {
    ""      0;
    default 1;
}

# ── 第二部分：放在 www.letaidraw.com 的 server {} 内，位于 location / 之前 ──
#
