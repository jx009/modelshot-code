# Run on a separate export host after migrations/client rollout and validation.
# This file intentionally does not start web, DB, Redis, payment or model workers.
services:
  creation-export:
    image: ${CREATION_EXPORT_IMAGE:?Set the validated dedicated export image tag}
    entrypoint: ["node"]
    command: ["src/workers/creation-export-main.mjs"]
    user: "node"
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    # Chromium 的线程也计入进程数：只启动浏览器就用掉约 40 个，64 会让页面进程创建失败（Target crashed）。
    pids_limit: 512
    cpus: 1.0
    mem_limit: 768m
    memswap_limit: 768m
    stop_grace_period: 60s
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=384m,mode=1777
    environment:
      NODE_ENV: production
      CREATION_EXPORT_ISOLATED: "true"
      DATABASE_URL: ${DATABASE_URL:?Set the remote database URL}
      REDIS_URL: ${REDIS_URL:?Set the remote Redis URL}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_BUCKET: ${S3_BUCKET:?Set the private bucket}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set storage credentials}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set storage credentials}
