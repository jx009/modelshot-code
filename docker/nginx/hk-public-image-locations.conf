location ~ ^/(?:studio|inspiration)/(?:[a-zA-Z0-9_-][a-zA-Z0-9_.-]*/)*[a-zA-Z0-9_-][a-zA-Z0-9_.-]*\.(?:webp|png|jpg|jpeg|avif)$ {
    root $letaidraw_public_root;
    try_files $uri @letaidraw_public_image_origin;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-HK-Entry "1" always;
    add_header X-HK-Public "local" always;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
}

location @letaidraw_public_image_origin {
    proxy_pass https://letaidraw_us_origin;
    proxy_buffering on;
    proxy_cache off;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-cache";
    add_header X-HK-Entry "1" always;
    add_header X-HK-Public "origin" always;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
}
