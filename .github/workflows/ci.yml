name: V1 Development Acceptance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  motion-media:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk
      - run: python -m pip install -r services/image-tools/requirements.txt
      - run: python -m unittest discover -s services/image-tools -p test_motion.py

  local-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://modelshot:local-modelshot-only@127.0.0.1:55432/modelshot_test
      DIRECT_URL: postgresql://modelshot:local-modelshot-only@127.0.0.1:55432/modelshot_test
      NEXTAUTH_URL: http://127.0.0.1:3100
      NEXTAUTH_SECRET: isolated-ci-session-secret-not-for-deployment
      C2PA_ENABLED: "0"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@10.9.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: npm ci
      - run: python -m unittest discover -s tests/deployment -p "test_*.py"
      - run: node --test tests/deployment/*.test.mjs
      - run: npx prisma generate
      # These checks do not need container services. Keep their results visible
      # even when an external image registry prevents integration setup.
      - run: npm run check:static
      - run: npm run test:unit
        id: unit
      - name: Compare upgrade failures with the original baseline
        if: ${{ failure() && steps.unit.outcome == 'failure' && github.ref_name == 'codex/jimeng-image-video-upgrade' }}
        continue-on-error: true
        run: |
          git fetch --depth=1 origin 4b64f3b3cfde1d2da9365aa6ccb898eea519d3ce
          baseline_dir="$RUNNER_TEMP/modelshot-original-baseline"
          mkdir -p "$baseline_dir"
          git archive 4b64f3b3cfde1d2da9365aa6ccb898eea519d3ce | tar -x -C "$baseline_dir"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$baseline_dir/node_modules"
          cd "$baseline_dir"
          npm run test:unit -- tests/unit/admin-creation-access.test.mjs tests/unit/admin-ocr-upscale.test.jsx tests/unit/admin-storage-route.test.mjs tests/unit/creation-artifact-codecs.test.mjs tests/unit/creation-native-office-storage.test.mjs tests/unit/creation-workspace-split.test.jsx tests/unit/creation-workspace-web.test.jsx tests/unit/direct-upload.test.mjs tests/unit/discover-home-readiness.test.jsx tests/unit/studio-cloud.test.mjs tests/unit/studio-pixels.test.mjs tests/unit/video-provider-adapters.test.mjs tests/unit/video-workspace-layout.test.jsx
      - run: npm run infra:up
      - run: npx playwright install --with-deps chromium
      - run: npm run test:integration
      - run: npm run build
      - run: npm run test:e2e
      - run: npm run test:recovery
      - run: npm run test:capacity
      - name: Dependency audit report
        if: always()
        run: npm run check:dependencies
      - name: Upload failure reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ failure() }}
        continue-on-error: true
        with:
          name: acceptance-reports
          retention-days: 1
          if-no-files-found: warn
          path: |
            playwright-report/
            test-results/
      - if: always()
        run: docker compose down
