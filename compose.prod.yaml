# 生产部署编排。本地开发请继续使用 compose.yaml，两者互不影响。
#
# 与本地编排的三个关键差别：
#   1. 数据库、Redis、私有存储不对宿主机暴露端口，只在内部网络互通；
#   2. Web 与 Worker 拆成两个容器，共用同一个镜像，各自独立重启；
#   3. 迁移是独立的一次性服务，Web/Worker 等它成功后才启动，不在每个副本里自动迁移。
#
# 用法（必须带 --env-file，Compose 的变量替换读的是它，不是项目里的 .env）：
#   docker compose --env-file .env.production -f compose.prod.yaml up -d --build
#   docker compose --env-file .env.production -f compose.prod.yaml ps
#   docker compose --env-file .env.production -f compose.prod.yaml logs -f web worker
#
# 想省掉参数，可在服务器 shell 里导出：
#   export COMPOSE_FILE=compose.prod.yaml COMPOSE_ENV_FILES=.env.production

name: modelshot

x-modelshot-image: &modelshot-image
  build:
    context: .
    args:
      NODE_IMAGE: ${NODE_IMAGE:-node:22.23.2-bookworm-slim}
  image: ${MODELSHOT_IMAGE:-modelshot:prod}

# Web / Worker / migrate 共用的运行时环境。
# 容器里的 localhost 指容器自己，所以这里一律写成 Compose 服务名。
# DATABASE_URL、REDIS_URL、S3_* 由单一口径的 POSTGRES_* / STORAGE_* 推导，避免两处配置打架。
x-app-environment: &app-environment
  NODE_ENV: production
  PORT: "3000"
  # 发布镜像固定为无签名构建，置 1 会被入口脚本直接拒绝启动。
  C2PA_ENABLED: "0"
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  DIRECT_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT: http://storage:9000
  S3_FORCE_PATH_STYLE: "true"
  S3_ACCESS_KEY_ID: ${STORAGE_ROOT_USER}
  S3_SECRET_ACCESS_KEY: ${STORAGE_ROOT_PASSWORD}
  S3_BUCKET: ${STORAGE_BUCKET:-modelshot-assets}
  NEXTAUTH_URL: ${PUBLIC_URL:?PUBLIC_URL is required, e.g. https://modelshot.example.com}
  TRUST_PROXY: ${TRUST_PROXY:-false}

x-modelshot-service: &modelshot-service
  <<: *modelshot-image
  restart: unless-stopped
  env_file:
    - .env.production
  environment:
    <<: *app-environment
  networks:
    - app
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    image: postgres:17.9-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-modelshot}
      # 数据页校验和，写入时就发现损坏，便于备份恢复核对。
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-modelshot}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7.4.9-alpine
    restart: unless-stopped
    # AOF 打开；Redis 只承载队列和调度，账本事实来源始终是 PostgreSQL。
    command: ["redis-server", "--appendonly", "yes", "--save", "300", "1"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  storage:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${STORAGE_ROOT_USER:?STORAGE_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${STORAGE_ROOT_PASSWORD:?STORAGE_ROOT_PASSWORD is required}
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 一次性：创建私有 bucket。脚本随应用镜像发布，不依赖宿主机源码。
  storage-init:
    <<: *modelshot-service
    restart: "no"
    command: ["node", "docker/create-bucket.mjs"]
    depends_on:
      storage:
        condition: service_healthy
    networks:
      - app

  # 一次性：应用正式迁移。禁止用 db push 代替。
  # 需要专用迁移账号时：docker compose ... run --rm -e DATABASE_URL=postgresql://migrator:...@postgres:5432/modelshot migrate
  migrate:
    <<: *modelshot-service
    restart: "no"
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app

  web:
    <<: *modelshot-service
    command: ["web"]
    # 默认只绑回环，由宿主机 Nginx/Caddy 终止 TLS 再转发；不想装反代就把 BIND_ADDR 改成 0.0.0.0。
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s
    networks:
      - app

  # 必须独立常驻。SIGTERM 后等待正在执行的供应商调用收尾，故宽限 180 秒。
  worker:
    <<: *modelshot-service
    command: ["worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    stop_grace_period: 180s
    networks:
      - app

  # ---- 以下为一次性工具，不会随 up 启动，用 --profile tools run 调用 ----
  # 初始化供应商、预设模特、场景和提示词模板（幂等，可重复执行）。
  seed:
    <<: *modelshot-service
    profiles: [tools]
    restart: "no"
    command: ["node", "prisma/seed.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - app

  # 为已注册账号导入 5 张 CC0 服装样例，同时更新合成模特与场景预设：
  #   ... --profile tools run --rm demo-seed --user-email=you@example.com
  demo-seed:
    <<: *modelshot-service
    profiles: [tools]
    restart: "no"
    entrypoint: ["node", "scripts/seed-demo-assets.mjs"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    networks:
      - app

  # 提权管理员。脚本已随镜像发布（见 Dockerfile 的 scripts/ 复制），
  # 因此拉镜像部署时服务器不需要源码，也不要再挂载 ./scripts，
  # 否则宿主机路径不存在时 Docker 会建一个同名空目录，反而把镜像里的文件遮住。
  #
  # Docker Compose 的 `run` 会用命令行参数**整体替换** command，所以这里必须用
  # entrypoint 而不是 command，参数才能正确透传给脚本：
  #   ... --profile tools run --rm admin you@example.com --role=root
  admin:
    <<: *modelshot-service
    profiles: [tools]
    restart: "no"
    entrypoint: ["node", "scripts/make-admin.js"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app

  # 运维命令。默认打印状态，也可以在命令末尾追加子命令覆盖：
  #   ... --profile tools run --rm ops ops reconcile
  ops:
    <<: *modelshot-service
    profiles: [tools]
    restart: "no"
    command: ["ops", "status"]
    networks:
      - app

networks:
  app:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  storage-data:
