#     proxy_cache_bypass $letaidraw_page_bypass;
#     proxy_no_cache $letaidraw_page_bypass;
#     proxy_cache_valid 200 60s;
#     proxy_cache_valid 404 10s;
#     proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
#     proxy_cache_background_update on;
#     proxy_cache_lock on;
#     proxy_cache_lock_timeout 5s;
#     add_header X-HK-Entry "1" always;
#     add_header X-HK-Page-Cache $upstream_cache_status always;
#     add_header Alt-Svc 'h3=":443"; ma=86400' always;
# }
#
# 说明：查询参数不进缓存键（营销 UTM 不应拆分缓存）。页面里依赖 searchParams 的逻辑
# 都在客户端执行，HTML 本身相同。

# ── 第三部分：压缩，放在 http {} 或 server {} 内（若宝塔已全局开启可跳过） ──
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types text/html text/css text/plain application/javascript application/json image/svg+xml;
# 若已编译 ngx_brotli，再开启：
# brotli on; brotli_comp_level 5;
# brotli_types text/html text/css text/plain application/javascript application/json image/svg+xml;
