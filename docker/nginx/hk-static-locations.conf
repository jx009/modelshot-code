# Inside the Hong Kong www.letaidraw.com server {} block.
# Replace the old location ^~ /_next/static/; keep the main location / proxy.
# Inherits existing proxy headers, TLS verification, timeouts and X-HK headers.
location ^~ /_next/static/ {
    root /www/wwwroot/www.letaidraw.com;
    try_files $uri @letaidraw_static_origin;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-HK-Entry "1" always;
    add_header X-HK-Static "local" always;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
}

# First deployment / missing files can still load from the US source.
location @letaidraw_static_origin {
    proxy_pass https://letaidraw_us_origin;
    proxy_buffering on;
    proxy_cache letaidraw_hk_static;
    proxy_cache_key "$host$request_uri";
    proxy_cache_valid 200 30d;
    proxy_cache_lock on;
    add_header X-HK-Entry "1" always;
    add_header X-HK-Static "origin" always;
    add_header X-HK-Cache $upstream_cache_status always;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
}
