# Include inside the mainland www.letaidraw.com server {}.
# Keep location / proxying to the US. Define letaidraw_us_origin in http {}.
# Set origin Host, TLS/SNI verification and forwarding headers at server level
# so the named fallback inherits them; see docs/mainland-static-deployment.md.
location ^~ /_next/static/ {
    root /www/wwwroot/www.letaidraw.com;
    try_files $uri @letaidraw_cn_static_origin;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-CN-Static "local" always;
}

# Place before any general image-extension regex locations in the panel.
location ~ ^/(?:studio|inspiration)/(?:[a-zA-Z0-9_-][a-zA-Z0-9_.-]*/)*[a-zA-Z0-9_-][a-zA-Z0-9_.-]*\.(?:webp|png|jpg|jpeg|avif)$ {
    root $letaidraw_cn_public_root;
    try_files $uri @letaidraw_cn_static_origin;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-CN-Public "local" always;
}

# Never store missing/unknown releases as immutable copies of the current one.
location @letaidraw_cn_static_origin {
    proxy_pass https://letaidraw_us_origin;
    proxy_buffering on;
    proxy_cache off;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    add_header Cache-Control "no-cache";
    add_header X-CN-Static "origin" always;
}
