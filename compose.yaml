name: modelshot-local

services:
  postgres:
    image: postgres:17.9-alpine
    environment:
      POSTGRES_USER: modelshot
      POSTGRES_PASSWORD: local-modelshot-only
      POSTGRES_DB: modelshot
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modelshot -d modelshot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4.9-alpine
    ports:
      - "127.0.0.1:56379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: modelshot-local
      MINIO_ROOT_PASSWORD: local-modelshot-storage-only
    ports:
      - "127.0.0.1:59000:9000"
      - "127.0.0.1:59001:9001"
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  mail:
    image: axllent/mailpit:v1.29.2
    ports:
      - "127.0.0.1:51025:1025"
      - "127.0.0.1:58025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  redis-data:
  storage-data:
