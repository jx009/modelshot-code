name: V1 Development Acceptance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  motion-media:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk
      - run: python -m pip install -r services/image-tools/requirements.txt
      - run: python -m unittest discover -s services/image-tools -p test_motion.py

  local-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://modelshot:local-modelshot-only@127.0.0.1:55432/modelshot_test
      DIRECT_URL: postgresql://modelshot:local-modelshot-only@127.0.0.1:55432/modelshot_test
      NEXTAUTH_URL: http://127.0.0.1:3100
      NEXTAUTH_SECRET: isolated-ci-session-secret-not-for-deployment
      C2PA_ENABLED: "0"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@10.9.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: npm ci
      - run: python -m unittest discover -s tests/deployment -p "test_*.py"
      - run: node --test tests/deployment/*.test.mjs
      - run: npx prisma generate
      # These checks do not need container services. Keep their results visible
      # even when an external image registry prevents integration setup.
      - run: npm run check:static
      - run: npm run test:unit
      # The historical official MinIO image is no longer publicly pullable.
      # Build the exact source release for isolated CI instead of changing the
      # application's storage protocol or depending on an unverified mirror.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.24.2"
          cache: false
      - name: Build the pinned MinIO test server
        env:
          GOMAXPROCS: "2"
          CGO_ENABLED: "0"
        run: |
          git init "$RUNNER_TEMP/minio-source"
          git -C "$RUNNER_TEMP/minio-source" remote add origin https://github.com/minio/minio.git
          git -C "$RUNNER_TEMP/minio-source" fetch --depth=1 origin 0d7408fc9969caf07de6a8c3a84f9fbb10a6739e
          git -C "$RUNNER_TEMP/minio-source" checkout --detach FETCH_HEAD
          cd "$RUNNER_TEMP/minio-source"
          go build -p 2 -mod=readonly -trimpath -o "$RUNNER_TEMP/minio" .
      - name: Start isolated test services
        run: |
          docker compose up -d --wait postgres redis mail
          MINIO_ROOT_USER=modelshot-local MINIO_ROOT_PASSWORD=local-modelshot-storage-only nohup "$RUNNER_TEMP/minio" server "$RUNNER_TEMP/minio-data" --address 127.0.0.1:59000 --console-address 127.0.0.1:59001 > "$RUNNER_TEMP/minio.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/minio.pid"
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:59000/minio/health/live; then exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/minio.log"
          exit 1
      - run: npx playwright install --with-deps chromium
      - run: npm run test:integration
      - run: npm run build
      - run: npm run test:e2e
      - run: npm run test:recovery
      - run: npm run test:capacity
      - name: Dependency audit report
        if: always()
        run: npm run check:dependencies
      - name: Upload failure reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ failure() }}
        continue-on-error: true
        with:
          name: acceptance-reports
          retention-days: 1
          if-no-files-found: warn
          path: |
            playwright-report/
            test-results/
      - if: always()
        run: |
          docker compose down
          if [ -f "$RUNNER_TEMP/minio.pid" ]; then kill "$(cat "$RUNNER_TEMP/minio.pid")" 2>/dev/null || true; fi
